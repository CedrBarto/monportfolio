# Bandeau des passions
# file : icône SVG découpée (chemin dans le dossier assets/, ex. icons/roller.svg), intégrée dans la page pour animer chaque partie
# name : nom affiché au survol et lu par les lecteurs d'écran
# anim : animation jouée au clic (roll, scratch, spin, disco, pop, glide, slope, bounce, pulse)
items = [
  { file = "icons/roller.svg", name = "Roller", anim = "roll" },
  { file = "icons/platines.svg", name = "Platines", anim = "scratch" },
  { file = "icons/vinyle.svg", name = "Vinyles", anim = "spin" },
  { file = "icons/disco.svg", name = "Disco", anim = "disco" },
  { file = "icons/popcorn.svg", name = "Cinéma", anim = "pop" },
  { file = "icons/patin.svg", name = "Patin à glace", anim = "glide" },
  { file = "icons/ski.svg", name = "Ski", anim = "slope" },
  { file = "icons/volley.svg", name = "Volley", anim = "bounce" },
]
